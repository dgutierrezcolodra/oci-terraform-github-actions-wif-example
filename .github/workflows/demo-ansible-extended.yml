name: Demo Ansible WIF Credential Renewal

on:
  workflow_dispatch:
    inputs:
      proof_mode:
        description: "Proof duration"
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - renewal-65m

jobs:
  demonstrate_credential_renewal:
    name: Demonstrate Ansible WIF credential renewal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      OCI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Ansible and OCI dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/oci-ansible-wif-venv"
          "$RUNNER_TEMP/oci-ansible-wif-venv/bin/python" -m pip install "ansible-core==2.15.13" "oci==2.182.1"
          "$RUNNER_TEMP/oci-ansible-wif-venv/bin/ansible-galaxy" collection install \
            --collections-path "$RUNNER_TEMP/oci-ansible-collections" \
            --requirements-file examples/ansible/requirements.yml
          echo "$RUNNER_TEMP/oci-ansible-wif-venv/bin" >> "$GITHUB_PATH"

      - name: Resolve proof duration
        id: proof
        shell: bash
        env:
          PROOF_MODE: ${{ inputs.proof_mode }}
        run: |
          case "$PROOF_MODE" in
            smoke) wait_seconds=120 ;;
            renewal-65m) wait_seconds=3900 ;;
            *) echo "Unsupported proof mode" >&2; exit 1 ;;
          esac
          echo "wait_seconds=$wait_seconds" >> "$GITHUB_OUTPUT"

      - name: Create refreshable GitHub OIDC token file
        uses: ./.github/actions/github-oidc-token-refresh
        with:
          audience: https://cloud.oracle.com
          refresh_interval_minutes: "1"

      - name: Validate OCI WIF configuration
        shell: bash
        env:
          OCI_TOKEN_EXCHANGE_DOMAIN_URL: ${{ secrets.DOMAIN_BASE_URL }}
          OCI_TOKEN_EXCHANGE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          OCI_TOKEN_EXCHANGE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          if [[ -z "$OCI_TOKEN_EXCHANGE_CLIENT_ID" || -z "$OCI_TOKEN_EXCHANGE_CLIENT_SECRET" ]]; then
            echo 'Missing OCI WIF client credentials' >&2
            exit 1
          fi
          echo "::add-mask::$OCI_TOKEN_EXCHANGE_CLIENT_ID"
          echo "::add-mask::$OCI_TOKEN_EXCHANGE_CLIENT_SECRET"

      - name: Create OCI Ansible WIF credentials
        uses: ./.github/actions/ansible-oci-wif
        env:
          OCI_TOKEN_EXCHANGE_DOMAIN_URL: ${{ secrets.DOMAIN_BASE_URL }}
          OCI_TOKEN_EXCHANGE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          OCI_TOKEN_EXCHANGE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Run extended Ansible WIF proof
        shell: bash
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/oci-ansible-collections
          WAIT_SECONDS: ${{ steps.proof.outputs.wait_seconds }}
          OCI_TOKEN_EXCHANGE_DOMAIN_URL: ${{ secrets.DOMAIN_BASE_URL }}
          OCI_TOKEN_EXCHANGE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          OCI_TOKEN_EXCHANGE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          "$RUNNER_TEMP/oci-ansible-wif-venv/bin/ansible-playbook" \
            --extra-vars "wif_wait_seconds=$WAIT_SECONDS" \
            --extra-vars "wif_helper_path=$GITHUB_WORKSPACE/.github/actions/ansible-oci-wif/main.py" \
            examples/ansible/extended-runtime/playbook.yml

      - name: Stop OIDC refresh daemon and remove credentials
        id: cleanup_oidc_refresh
        if: always()
        shell: bash
        run: |
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" == "/" ]]; then
            echo "RUNNER_TEMP is not a safe cleanup root" >&2
            exit 1
          fi

          credential_directory="$RUNNER_TEMP/oci-wif"
          ansible_credential_directory="$RUNNER_TEMP/oci-ansible-wif"
          venv_directory="$RUNNER_TEMP/oci-ansible-wif-venv"
          collections_directory="$RUNNER_TEMP/oci-ansible-collections"
          pid_file="$credential_directory/refresh-daemon.pid"
          trap 'rm -rf -- "$credential_directory"' EXIT

          daemon_matches() {
            local daemon_command
            daemon_command="$(ps -ww -p "$daemon_pid" -o command= 2>/dev/null || true)"
            [[ "$daemon_command" == *"$expected_command_suffix" ]]
          }

          if [[ -d "$credential_directory" && ! -L "$credential_directory" && -f "$pid_file" && ! -L "$pid_file" ]]; then
            credential_directory_real="$(realpath "$credential_directory")"
            pid_file_real="$(realpath "$pid_file")"
            if [[ "$pid_file_real" == "$credential_directory_real/refresh-daemon.pid" ]]; then
              daemon_pid="$(<"$pid_file")"
              line_count="$(wc -l < "$pid_file")"
              expected_command_suffix="$GITHUB_WORKSPACE/.github/actions/github-oidc-token-refresh/main.py --daemon --pid-file $pid_file_real"
              if [[ "$line_count" -eq 1 && "$daemon_pid" =~ ^[1-9][0-9]*$ ]] && daemon_matches; then
                kill -TERM "$daemon_pid" 2>/dev/null || true
                for _ in {1..50}; do
                  if ! kill -0 "$daemon_pid" 2>/dev/null; then
                    break
                  fi
                  sleep 0.1
                done
                if kill -0 "$daemon_pid" 2>/dev/null && daemon_matches; then
                  kill -KILL "$daemon_pid" 2>/dev/null || true
                fi
              fi
            fi
          fi

          rm -rf -- "$credential_directory" "$ansible_credential_directory" "$venv_directory" "$collections_directory"
          if [[ -e "$credential_directory" || -e "$ansible_credential_directory" ]]; then
            echo "Credential cleanup failed" >&2
            exit 1
          fi
          echo "Credential cleanup complete."
