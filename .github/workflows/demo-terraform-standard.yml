name: Demo Terraform Apply (Standard)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply-and-destroy
      bucket_name:
        description: "Bucket name (optional; a unique name is generated when empty)"
        required: false
        type: string

  push:
    branches:
      - main
    paths:
      - "examples/terraform/standard/**"
      - ".github/actions/github-oidc-token/**"
      - ".github/workflows/demo-terraform-standard.yml"

jobs:
  terraform_oci:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC token
      contents: read

    env:
      TF_VAR_compartment_id: ${{ secrets.COMPARTMENT_ID }}
      TF_VAR_oci_region: ${{ secrets.OCI_REGION }}
      TF_VAR_bucket_name: ${{ github.event.inputs.bucket_name || format('terraform-wif-validation-{0}', github.run_id) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"

      - name: Create GitHub OIDC token file
        uses: ./.github/actions/github-oidc-token
        with:
          audience: https://cloud.oracle.com

      - name: Export OCI WIF configuration
        shell: bash
        env:
          WIF_DOMAIN_URL: ${{ secrets.DOMAIN_BASE_URL }}
          WIF_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          WIF_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          if [[ -z "$WIF_CLIENT_ID" || -z "$WIF_CLIENT_SECRET" ]]; then
            echo 'Missing OCI WIF client credentials' >&2
            exit 1
          fi
          echo "::add-mask::$WIF_CLIENT_ID"
          echo "::add-mask::$WIF_CLIENT_SECRET"
          {
            echo 'OCI_AUTH=WorkloadIdentityFederation'
            echo "OCI_REGION=$TF_VAR_oci_region"
            echo "OCI_TOKEN_EXCHANGE_DOMAIN_URL=$WIF_DOMAIN_URL"
            echo 'OCI_TOKEN_EXCHANGE_AUTH=OAuthClientCredentials'
            echo "OCI_TOKEN_EXCHANGE_CLIENT_ID=$WIF_CLIENT_ID"
            echo 'OCI_TOKEN_EXCHANGE_REQUESTED_TOKEN_TYPE=urn:oci:token-type:oci-upst'
            echo 'OCI_TOKEN_EXCHANGE_SUBJECT_TOKEN_TYPE=jwt'
          } >> "$GITHUB_ENV"

      - name: Prepare pinned OCI Landing Zones Orchestrator root
        shell: bash
        env:
          TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
        run: |
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" == "/" ]]; then
            echo 'RUNNER_TEMP is not a safe runtime root' >&2
            exit 1
          fi
          if [[ -z "$TENANCY_OCID" || -z "$TF_VAR_compartment_id" || -z "$TF_VAR_oci_region" ]]; then
            echo 'Missing OCI Orchestrator input' >&2
            exit 1
          fi

          echo "::add-mask::$TENANCY_OCID"
          runtime_directory="$RUNNER_TEMP/oci-wif"
          orchestrator_directory="$RUNNER_TEMP/oci-lz-orchestrator"
          input_file="$runtime_directory/orchestrator-inputs.tfvars.json"
          plan_file="$runtime_directory/orchestrator.tfplan"
          expected_commit='34202e837e9df015ddaaa4fce0ab62bb6e3883de'

          install -d -m 700 "$runtime_directory"
          git clone --depth 1 --branch v2.1.3 \
            https://github.com/oci-landing-zones/terraform-oci-modules-orchestrator.git \
            "$orchestrator_directory"
          actual_commit="$(git -C "$orchestrator_directory" rev-parse HEAD)"
          if [[ "$actual_commit" != "$expected_commit" ]]; then
            echo 'Unexpected OCI Landing Zones Orchestrator commit' >&2
            exit 1
          fi

          install -m 600 examples/terraform/standard/orchestrator.lock.hcl \
            "$orchestrator_directory/.terraform.lock.hcl"
          temporary_input="$(mktemp "$runtime_directory/orchestrator-inputs.XXXXXX")"
          trap 'rm -f -- "$temporary_input"' EXIT
          jq -n \
            --arg tenancy_ocid "$TENANCY_OCID" \
            --arg region "$TF_VAR_oci_region" \
            --arg compartment_id "$TF_VAR_compartment_id" \
            --arg bucket_name "$TF_VAR_bucket_name" \
            '{
              tenancy_ocid: $tenancy_ocid,
              region: $region,
              object_storage_configuration: {
                default_compartment_id: $compartment_id,
                buckets: {
                  validation: {
                    name: $bucket_name,
                    compartment_id: $compartment_id
                  }
                }
              }
            }' > "$temporary_input"
          chmod 600 "$temporary_input"
          mv -- "$temporary_input" "$input_file"

          {
            echo "ORCHESTRATOR_ROOT=$orchestrator_directory"
            echo "ORCHESTRATOR_INPUT_FILE=$input_file"
            echo "ORCHESTRATOR_PLAN_FILE=$plan_file"
            echo "TF_DATA_DIR=$runtime_directory/terraform-data"
          } >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform -chdir="$ORCHESTRATOR_ROOT" init -lockfile=readonly

      - name: Terraform Validate
        run: terraform -chdir="$ORCHESTRATOR_ROOT" validate

      - name: Terraform Plan
        env:
          OCI_TOKEN_EXCHANGE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: terraform -chdir="$ORCHESTRATOR_ROOT" plan -out="$ORCHESTRATOR_PLAN_FILE" -var-file="$ORCHESTRATOR_INPUT_FILE"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply-and-destroy'
        env:
          OCI_TOKEN_EXCHANGE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: terraform -chdir="$ORCHESTRATOR_ROOT" apply -auto-approve "$ORCHESTRATOR_PLAN_FILE"

      - name: Terraform Destroy (cleanup)
        if: always() && github.event.inputs.action == 'apply-and-destroy' && env.ORCHESTRATOR_ROOT != ''
        env:
          OCI_TOKEN_EXCHANGE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: terraform -chdir="$ORCHESTRATOR_ROOT" destroy -auto-approve -var-file="$ORCHESTRATOR_INPUT_FILE"

      - name: Remove runtime files
        if: always()
        shell: bash
        run: |
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" == "/" ]]; then
            echo 'RUNNER_TEMP is not a safe cleanup root' >&2
            exit 1
          fi
          rm -rf -- "$RUNNER_TEMP/oci-wif" "$RUNNER_TEMP/oci-lz-orchestrator"
