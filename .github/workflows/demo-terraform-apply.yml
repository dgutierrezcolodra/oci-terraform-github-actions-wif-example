name: Demo Terraform Apply (Standard)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      compartment_id:
        description: "Compartment OCID (optional, uses secret if not provided)"
        required: false
        type: string
      bucket_name:
        description: "Bucket name (optional, default: terraform-validation-bucket)"
        required: false
        type: string
        default: "terraform-validation-bucket"
      sdk_debug:
        description: "Enable redacted OCI SDK diagnostic logging"
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/**"

jobs:
  terraform_oci:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC token
      contents: read

    env:
      TF_VAR_compartment_id: ${{ github.event.inputs.compartment_id || secrets.COMPARTMENT_ID }}
      TF_VAR_oci_region: ${{ secrets.OCI_REGION }}
      TF_VAR_bucket_name: ${{ github.event.inputs.bucket_name || 'terraform-validation-bucket' }}
      OCI_GO_SDK_DEBUG: ${{ inputs.sdk_debug && 'info' || 'null' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.4"

      - name: Create GitHub OIDC token file
        uses: ./github-oidc-token
        with:
          audience: https://cloud.oracle.com

      - name: Export OCI WIF configuration
        shell: bash
        env:
          WIF_DOMAIN_URL: ${{ secrets.DOMAIN_BASE_URL }}
          WIF_CLIENT_ID: ${{ secrets.OCI_WIF_CLIENT_ID || secrets.CLIENT_ID }}
          WIF_CLIENT_SECRET: ${{ secrets.OCI_WIF_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          WIF_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID || secrets.OCI_TENANCY }}
        run: |
          {
            echo 'OCI_AUTH=WorkloadIdentityFederation'
            echo "OCI_REGION=$TF_VAR_oci_region"
            echo "OCI_TENANCY_OCID=$WIF_TENANCY_OCID"
            echo "OCI_TOKEN_EXCHANGE_DOMAIN_URL=$WIF_DOMAIN_URL"
            echo 'OCI_TOKEN_EXCHANGE_AUTH=OAuthClientCredentials'
            echo "OCI_TOKEN_EXCHANGE_CLIENT_ID=$WIF_CLIENT_ID"
            echo "OCI_TOKEN_EXCHANGE_CLIENT_SECRET=$WIF_CLIENT_SECRET"
            echo 'OCI_TOKEN_EXCHANGE_REQUESTED_TOKEN_TYPE=urn:oci:token-type:oci-upst'
            echo 'OCI_TOKEN_EXCHANGE_SUBJECT_TOKEN_TYPE=jwt'
          } >> "$GITHUB_ENV"

      - name: Diagnose OCI token exchange
        if: inputs.sdk_debug
        shell: bash
        env:
          WIF_DOMAIN_URL: ${{ secrets.DOMAIN_BASE_URL }}
          WIF_CLIENT_ID: ${{ secrets.OCI_WIF_CLIENT_ID || secrets.CLIENT_ID }}
          WIF_CLIENT_SECRET: ${{ secrets.OCI_WIF_CLIENT_SECRET || secrets.CLIENT_SECRET }}
        run: |
          key_file="$RUNNER_TEMP/oci-wif/diagnostic-key.pem"
          response_file="$RUNNER_TEMP/oci-wif/diagnostic-response.json"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$key_file"
          public_key=$(openssl pkey -in "$key_file" -pubout -outform DER | base64 -w0)
          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --user "$WIF_CLIENT_ID:$WIF_CLIENT_SECRET" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:oci:token-type:oci-upst' \
            --data-urlencode 'subject_token_type=jwt' \
            --data-urlencode "public_key=$public_key" \
            --data-urlencode "subject_token@$OCI_WORKLOAD_IDENTITY_TOKEN_PATH" \
            "$WIF_DOMAIN_URL/oauth2/v1/token")
          rm -f "$key_file"
          if [[ "$status" == "200" ]]; then
            echo 'OCI token exchange diagnostic succeeded (HTTP 200)'
            rm -f "$response_file"
          else
            echo "OCI token exchange diagnostic failed (HTTP $status)"
            jq '{error, error_description}' "$response_file"
            rm -f "$response_file"
            exit 1
          fi

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform
        run: terraform destroy -auto-approve
