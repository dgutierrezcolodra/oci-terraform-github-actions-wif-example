name: Demo Terraform Token Refresh

on:
  workflow_dispatch:
    inputs:
      wait_duration:
        description: "Terraform wait duration; use 65m for a full UPST-renewal test"
        required: false
        default: "120s"
        type: string

jobs:
  terraform_token_refresh:
    name: Terraform Token Refresh Demo
    runs-on: ubuntu-latest
    environment: oci-validation
    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_oci_region: ${{ secrets.OCI_REGION }}
      TF_VAR_wait_duration: ${{ inputs.wait_duration }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"

      - name: Create refreshable GitHub OIDC token file
        uses: ./github-oidc-token
        with:
          audience: https://cloud.oracle.com
          enable_token_refresh: true
          refresh_interval_minutes: 1

      - name: Export OCI WIF configuration
        shell: bash
        env:
          WIF_DOMAIN_URL: ${{ secrets.DOMAIN_BASE_URL }}
          WIF_CLIENT_ID: ${{ secrets.OCI_WIF_CLIENT_ID }}
          WIF_CLIENT_SECRET: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
          WIF_CLIENT_IDENTIFIER: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
        run: |
          if [[ -z "$WIF_CLIENT_ID" || -z "$WIF_CLIENT_SECRET" ]]; then
            if [[ "$WIF_CLIENT_IDENTIFIER" == *:* ]]; then
              WIF_CLIENT_ID=${WIF_CLIENT_IDENTIFIER%%:*}
              WIF_CLIENT_SECRET=${WIF_CLIENT_IDENTIFIER#*:}
            fi
          fi
          if [[ -z "$WIF_CLIENT_ID" || -z "$WIF_CLIENT_SECRET" ]]; then
            echo 'Missing OCI WIF client credentials' >&2
            exit 1
          fi
          echo "::add-mask::$WIF_CLIENT_ID"
          echo "::add-mask::$WIF_CLIENT_SECRET"
          {
            echo 'OCI_AUTH=WorkloadIdentityFederation'
            echo "OCI_REGION=$TF_VAR_oci_region"
            echo "OCI_TOKEN_EXCHANGE_DOMAIN_URL=$WIF_DOMAIN_URL"
            echo 'OCI_TOKEN_EXCHANGE_AUTH=OAuthClientCredentials'
            echo "OCI_TOKEN_EXCHANGE_CLIENT_ID=$WIF_CLIENT_ID"
            echo "OCI_TOKEN_EXCHANGE_CLIENT_SECRET=$WIF_CLIENT_SECRET"
            echo 'OCI_TOKEN_EXCHANGE_REQUESTED_TOKEN_TYPE=urn:oci:token-type:oci-upst'
            echo 'OCI_TOKEN_EXCHANGE_SUBJECT_TOKEN_TYPE=jwt'
          } >> "$GITHUB_ENV"

      - name: Show initial token timestamp
        run: |
          initial_token_mtime="$(stat -c %Y "$OCI_WORKLOAD_IDENTITY_TOKEN_PATH")"
          echo "INITIAL_TOKEN_MTIME=$initial_token_mtime" >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: examples/long-running-refresh
        run: terraform init

      - name: Terraform Validate
        working-directory: examples/long-running-refresh
        run: terraform validate

      - name: Terraform Apply (simulated long operation)
        working-directory: examples/long-running-refresh
        run: |
          echo "Starting Terraform apply with a simulated long-running operation..."
          echo "The background daemon refreshes only the GitHub source JWT file."
          echo "The OCI provider owns and renews the OCI UPST and RSA key."
          terraform apply -auto-approve

      - name: Show final token timestamp
        run: |
          final_token_mtime="$(stat -c %Y "$OCI_WORKLOAD_IDENTITY_TOKEN_PATH")"
          if (( final_token_mtime <= INITIAL_TOKEN_MTIME )); then
            echo "GitHub OIDC token file was not refreshed during Terraform apply" >&2
            exit 1
          fi

      - name: Cleanup
        if: always()
        working-directory: examples/long-running-refresh
        run: terraform destroy -auto-approve || true
